name: FoodMe PR CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run unit tests
        working-directory: apps/backend
        run: bash ./gradlew test --tests '*UnitTest'

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run controller integration tests
        working-directory: apps/backend
        run: bash ./gradlew test --tests '*ControllerTest'

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodme -d foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      VITE_API_BASE_URL: http://localhost:8081

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies and Chromium
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/admin ci
          (cd apps/web && npx playwright install --with-deps chromium)
          (cd apps/admin && npx playwright install chromium)
      - name: Start backend and run Playwright tests
        shell: bash
        run: |
          backend_log="$RUNNER_TEMP/foodme-backend.log"
          (cd apps/backend && exec bash ./gradlew --no-daemon bootRun) > "$backend_log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT

          if ! curl --fail --silent --show-error --max-time 5 \
            --retry 90 --retry-delay 2 --retry-connrefused \
            http://localhost:8081/actuator/health; then
            cat "$backend_log"
            exit 1
          fi

          result=0
          npm --prefix apps/web run test:e2e || result=1
          npm --prefix apps/admin run test:e2e || result=1
          exit "$result"

  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Run Qodana scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          args: --fail-threshold 0
          post-pr-comment: 'false'
          use-annotations: 'false'
          upload-result: 'true'
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
