name: PR Pipeline

on:
  pull_request:
    branches: [main]


concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write 
  pull-requests: write 
  checks: write 

env:
  JAVA_VERSION: "17" 
  NODE_VERSION: "22" 

jobs:

  unit-tests:
    name: Unit tests (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: apps/backend/build/reports/tests/test/
          retention-days: 7


  integration-tests:
    name: Integration tests (Docker image + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image (same as Render)
        run: docker build -f apps/backend/Dockerfile -t foodme:ci .

      - name: Start container
        run: |
          docker run -d --name foodme --network host \
            -e PORT=8081 \
            -e DB_HOST=localhost -e DB_PORT=5432 \
            -e DB_NAME=foodme -e DB_USER=foodme -e DB_PASSWORD=foodme \
            -e HTTP_LOGGING_ENABLED=false \
            foodme:ci

      - name: Wait until healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/actuator/health | grep -q '"UP"'; then
              echo "Backend is UP"; exit 0
            fi
            sleep 5
          done
          echo "Backend did not become healthy"; exit 1

      - name: Smoke-test API and SPAs
        run: |
          set -e
          check() {
            code=$(curl -s -o /tmp/body -w '%{http_code}' "http://localhost:8081$1")
            echo "$1 -> $code"
            [ "$code" = "200" ] || { cat /tmp/body; exit 1; }
          }
          check /actuator/health
          check /api/chef/active          # seeded data from Flyway migrations
          grep -q '[0-9a-zA-Z]' /tmp/body && [ "$(cat /tmp/body)" != "[]" ] || { echo "No seeded chefs"; exit 1; }
          check /api/dish/tags
          check /v3/api-docs
          check /                         # storefront index.html
          grep -qi '<html' /tmp/body
          check /backoffice/              # admin index.html
          grep -qi '<html' /tmp/body

      - name: Container logs
        if: always()
        run: docker logs foodme | tail -n 200


  e2e-tests:
    name: E2E tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, admin]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: foodme
          POSTGRES_USER: foodme
          POSTGRES_PASSWORD: foodme
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U foodme"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      VITE_API_BASE_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Start backend (Flyway seeds the DB)
        working-directory: apps/backend
        run: |
          ./gradlew bootJar --no-daemon
          JAR=$(ls build/libs/*.jar | grep -v plain)
          nohup java -jar "$JAR" > /tmp/backend.log 2>&1 &

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Wait for backend
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8081/actuator/health | grep -q '"UP"' && { echo "Backend is UP"; exit 0; }
            sleep 5
          done
          cat /tmp/backend.log | tail -n 100; exit 1

      - name: Run Playwright
        working-directory: apps/${{ matrix.app }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/playwright-report/
            apps/${{ matrix.app }}/test-results/
            /tmp/backend.log
          retention-days: 7


  qodana:
    name: Qodana (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            project-dir: apps/backend
            token: QODANA_TOKEN_BACKEND
          - name: frontend
            project-dir: .
            token: QODANA_TOKEN_FRONTEND
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: true
          args: --project-dir,${{ matrix.project-dir }},--fail-threshold,0
          artifact-name: qodana-report-${{ matrix.name }}
          cache-default-branch-only: true
        env:
          QODANA_TOKEN: ${{ secrets[matrix.token] }}

  
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests, qodana]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "❌ At least one job failed – PR cannot be merged"
            exit 1
          fi
          echo "✅ All jobs passed"
