version: "1.0"
linter: jetbrains/qodana-js:2026.2 
profile:
  name: qodana.recommended
bootstrap: npm ci --prefix apps/web && npm ci --prefix apps/admin
exclude:
  - name: All
    paths:
      - apps/backend
      - infra
      - "**/node_modules"
      - "**/dist"
      - "**/playwright-report"
      - "**/test-results"
      - "*.patch"
